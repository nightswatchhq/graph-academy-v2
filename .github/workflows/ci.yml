name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly freshness sweep
    - cron: '17 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registry integrity and parameter usage
        run: npm run params
      - name: Build
        run: npm run build
      - name: Internal links
        run: node scripts/check-links.mjs
      - name: Design system audit
        run: npm run audit:style
      - name: graph-support citations still exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-support-links.mjs

  lighthouse:
    # Runs against a local preview of the real build. Blocking on accessibility
    # and performance: this job caught nine contrast violations that the bespoke
    # style audit passed, so it is the one that actually protects readers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve and audit
        run: |
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/ --timeout 60000
          node scripts/lighthouse-check.mjs
          node scripts/mobile-check.mjs

  contrast:
    # Blocking. An accessibility regression is not a matter of taste.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/contrast.py

  staleness:
    # Non-blocking on a pull request, so a contributor is not punished for
    # somebody else's page going stale. Strict on the nightly schedule, where
    # going red is the entire point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Freshness report
        run: node scripts/staleness.mjs ${{ github.event_name == 'schedule' && '--strict' || '' }}
      - name: Outbound links
        if: github.event_name == 'schedule'
        run: |
          npm run build
          node scripts/check-links.mjs --external

  chain:
    # Reads the deployed contracts on Arbitrum One over a public RPC and
    # compares them against the registry. No secrets, so unlike `reconcile`
    # below it actually runs, and it runs on every push rather than nightly.
    # This is the job that would have caught the GIP-0089 figures being wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile against Arbitrum One
        run: node scripts/reconcile-rpc.mjs

  reconcile:
    # Reads the network subgraph for the values a contract call cannot give,
    # and reports drift. Needs a gateway key, so it skips more often than not;
    # `chain` above is the tier underneath it that always runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile against chain
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          NETWORK_SUBGRAPH_URL: ${{ secrets.NETWORK_SUBGRAPH_URL }}
          NETWORK_SUBGRAPH_QUERY: ${{ secrets.NETWORK_SUBGRAPH_QUERY }}
        run: node scripts/reconcile-onchain.mjs
