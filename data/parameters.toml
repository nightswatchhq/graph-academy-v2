# --------------------------------------------------------------------------
# Query fee rebates (GIP-0051)
# --------------------------------------------------------------------------

[rebate_lambda]
label = "Rebate function lambda"
value = 0.6
unit = ""
display = "0.6"
status = "current"
source = "https://github.com/graphprotocol/graph-improvement-proposals/blob/main/gips/0051-exponential-rebates.md"
quote = "We believe setting lambda=0.6 and alpha=1 ensures there will be enough stake to secure the network without putting too much of a staking burden on indexers."
note = """
The value proposed in GIP-0051. The deployed value lives in contract storage as \
lambdaNumerator / lambdaDenominator and can be changed by governance without a new \
GIP number. The GIP's own worked figures reproduce exactly at lambda 0.6 and alpha 1: \
a stake ratio of 4 returns 90.9% of fees, 6 returns 97.3%, 8 returns 99.2%. Anyone \
sizing real stake should read the contract rather than this page.\
"""
onchain_ref = "HorizonStaking.lambdaNumerator / lambdaDenominator"
verified = "2026-08-30"

[rebate_alpha]
label = "Rebate function alpha"
value = 1
unit = ""
display = "1"
status = "current"
source = "https://github.com/graphprotocol/graph-improvement-proposals/blob/main/gips/0051-exponential-rebates.md"
quote = "Where 0 <= alpha <= 1 and lambda > 0 are protocol parameters."
onchain_ref = "HorizonStaking.alphaNumerator / alphaDenominator"
verified = "2026-08-30"

[cobb_douglas_burn_pct]
label = "Query fees burned under Cobb-Douglas"
value = 50
unit = "% historically"
display = "over 50%"
status = "deprecated"
source = "https://github.com/graphprotocol/graph-improvement-proposals/blob/main/gips/0051-exponential-rebates.md"
quote = "Query fee burn would be less than 7%, which is in stark contrast to the current mechanism which historically has burned over 50% of query fees."
note = "The mechanism this replaced. Retained because the size of the improvement is the argument for the change, and because pre-2023 material still teaches Cobb-Douglas as current."
verified = "2026-08-30"

# --------------------------------------------------------------------------
# Issuance routing (GIP-0089, the Innovation Allocation)
# --------------------------------------------------------------------------

[innovation_allocation_pct]
label = "Issuance redirected to the Innovation Allocation"
value = 20
unit = "% of protocol issuance"
display = "20%"
status = "current"
source = "https://forum.thegraph.com/t/the-graph-council-has-approved-gip-0089-the-innovation-allocation/7035"
quote = "The Graph Council has approved GIP-0089, directing 20% of protocol issuance to the Innovation Allocation."
note = """
Approved by Council on 2026-08-26 and effective 2026-08-31. This is a live change, not \
a proposal. It reduces the issuance reaching indexers and therefore the issuance reaching \
delegators, by 20% at the source. Any indexing APR quoted from data collected before \
2026-08-31 is measuring a larger pie. The forum post gives the effective date as Monday \
2026-08-31 in one place and 2026-09-01 in another. Read the Issuance Allocator contract \
if the exact block matters to you.\
"""
note_source = "https://thegraph.com/ecosystem/governance/"
verified = "2026-08-30"

[subgraph_service_issuance_per_block]
label = "SubgraphService issuance after the redirect"
value = 96.584
unit = "GRT per block"
display = "96.584 GRT/block"
status = "current"
source = "https://forum.thegraph.com/t/the-graph-council-has-approved-gip-0089-the-innovation-allocation/7035"
quote = "The SubgraphService Rewards Manager receives 96.584 GRT per block, a reduction of 24.146 GRT per block from 120.73."
note = "Was 120.73 GRT per block before 2026-08-31. The 24.146 GRT per block difference goes to the Foundation treasury through an existing DirectAllocation contract."
verified = "2026-08-30"

# ==========================================================================
# Parameter history
#
# What a value IS is only half of what a reader needs. What it WAS, when it
# changed, and what changed it, is the part no other source keeps: the docs
# show current state, dashboards show live state, and neither remembers.
#
# Rules: a history entry needs a date, a from, a to, and a source that shows
# the change. Where the exact date is not established, name the release rather
# than inventing a day. `via` names the GIP or release that made the change.
# ==========================================================================

[[delegation_tax_pct.history]]
date = "2025-12-11"
from = "0.5%"
to = "0%"
via = "Graph Horizon"
note = "Removed from the protocol entirely rather than set to zero. The tokenomics page had not caught up as of 2026-08-30."
source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"

[[max_simultaneous_undelegations.history]]
date = "2025-12-11"
from = "1"
to = "1,000 or 100, sources disagree"
via = "Graph Horizon"
note = "Before Horizon a delegator could have only one active undelegation, so exiting several positions meant serialising the thawing period. The new ceiling is the one the two official pages disagree about."
source = "https://thegraph.com/docs/en/resources/roles/delegating/delegating/"

[[allocation_lifetime.history]]
date = "2025-12-11"
from = "Capped, closed to collect rewards"
to = "Indefinite in the protocol, still recycled by the shipped stack"
via = "Graph Horizon"
note = "The protocol capability and the shipped behaviour changed at different times, which is why this parameter is recorded as disputed."
source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"

[[delegated_stake_slashable.history]]
date = "2025-12-11"
from = "Not possible"
to = "Capability present, disabled for the Subgraph Service"
via = "Graph Horizon"
note = "A switch that exists and is off is a different thing from an impossibility, and enabling it is a governance decision rather than a rewrite."
source = "https://thegraph.com/docs/en/resources/roles/delegating/delegating/"

[[max_slash_pct.history]]
date = "2025-12-11"
from = "Fixed by the protocol"
to = "Judged by arbitrators, capped at 10%"
via = "Graph Horizon"
note = "A fixed penalty had to deter deliberate misbehaviour, which made it disproportionate for an honest operator with a chain data fault."
source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"

[[l2_curation_curve.history]]
date = "2023"
from = "Bonding curve"
to = "Flat"
via = "The move to Arbitrum One"
note = "Removed the early-mover advantage and with it an entire genre of curation timing strategy. Exact activation date not established here; recorded as the L2 move."
source = "https://thegraph.com/docs/en/arbitrum/l2-transfer-tools-guide/"

[[cobb_douglas_burn_pct.history]]
date = "2023"
from = "Cobb-Douglas, over 50% of query fees burned"
to = "Exponential rebates, under 7% projected"
via = "GIP-0051"
note = "The size of that gap is the argument the GIP makes for the change. Exact activation date not established here; recorded as the GIP that made it."
source = "https://github.com/graphprotocol/graph-improvement-proposals/blob/main/gips/0051-exponential-rebates.md"

[[innovation_allocation_pct.history]]
date = "2026-08-31"
from = "0%"
to = "20%"
via = "GIP-0089"
note = "Approved by Council on 2026-08-26. Redirects a fifth of protocol issuance to the Foundation treasury."
source = "https://forum.thegraph.com/t/the-graph-council-has-approved-gip-0089-the-innovation-allocation/7035"

[[subgraph_service_issuance_per_block.history]]
date = "2026-08-31"
from = "120.73 GRT/block"
to = "96.584 GRT/block"
via = "GIP-0089"
note = "A reduction of 24.146 GRT per block. Any indexing reward rate measured before this date is describing a larger pot."
source = "https://forum.thegraph.com/t/the-graph-council-has-approved-gip-0089-the-innovation-allocation/7035"
