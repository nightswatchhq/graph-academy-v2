# The Graph Academy - protocol parameter registry
#
# Single source of truth for every number that appears on the site. Prose never
# hard-codes a value; it calls the registry. This is the mechanism that stops the
# site rotting the way the 2022 version did, when Cobb-Douglas rebates and L1
# bonding curves were baked into paragraphs nobody could find again.
#
# Every entry carries a source URL and the date somebody read that URL. Where two
# official pages disagree, the entry carries a `note` and the disagreement is
# taught rather than hidden.
#
# Rules for editors:
#   - `verified` is the date a human opened `source` and read the value there.
#     Do not copy it forward from another entry.
#   - `status = "disputed"` means official sources conflict. Resolve against the
#     deployed contract, then downgrade to "current" and record what you found.
#   - `status = "deprecated"` means the value is retained for teaching only.

schema_version = 1
protocol_version = "Graph Horizon (2025-12-11)"

# --------------------------------------------------------------------------
# Indexing
# --------------------------------------------------------------------------

[min_indexer_self_stake]
label = "Minimum Indexer self-stake"
value = 100000
unit = "GRT"
display = "100,000 GRT"
status = "current"
source = "https://thegraph.com/docs/en/indexing/overview/"
quote = "The minimum stake for an Indexer is currently set to 100K GRT."
onchain_ref = "HorizonStaking.minimumIndexerStake"
verified = "2026-08-30"

[max_delegation_ratio]
label = "Maximum delegation ratio"
value = 16
unit = "x self-stake"
display = "16x"
status = "current"
source = "https://thegraph.com/docs/en/resources/roles/delegating/delegating/"
quote = "The Graph Network includes a delegation ratio of 16, meaning an Indexer can accept up to 16 times their Self-Stake in delegated GRT."
verified = "2026-08-30"

[max_poi_staleness_days]
label = "Maximum POI staleness"
value = 28
unit = "days"
display = "28 days"
status = "current"
source = "https://thegraph.com/docs/en/indexing/overview/"
quote = "The maxPOIStaleness parameter is currently set to 28 days."
onchain_ref = "SubgraphService.maxPOIStaleness"
verified = "2026-08-30"

[allocation_lifetime]
conflict = true
label = "Allocation lifetime"
value = "indefinite"
unit = ""
display = "Indefinite"
status = "disputed"
source = "https://thegraph.com/docs/en/indexing/overview/"
quote = "Under Graph Horizon, allocations can remain open indefinitely. There is no requirement to close an allocation to collect rewards."
note = """
The protocol permits indefinite allocations. The shipped indexer stack does not yet \
use them. The Horizon changes page states: "At Horizon launch the indexer stack will \
continue to operate using the current 'short lived' allocation lifecycle for an easier \
transition. This means that allocations will be recycled typically every 28 days." \
Teach the protocol capability and the operational reality as two separate facts, \
because an indexer planning capacity needs both.\
"""
note_source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"
verified = "2026-08-30"

[max_slash_pct]
label = "Maximum slashable percentage"
value = 10
unit = "% of stake"
display = "10%"
status = "current"
source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"
quote = "Arbitrators now have the flexibility to determine appropriate slash amounts based on the severity and context of infractions, up to a cap of 10% of the indexer's stake."
