# The Graph Academy - protocol parameter registry
#
# Single source of truth for every number that appears on the site. Prose never
# hard-codes a value; it calls the registry. This is the mechanism that stops the
# site rotting the way the 2022 version did, when Cobb-Douglas rebates and L1
# bonding curves were baked into paragraphs nobody could find again.
#
# Every entry carries a source URL and the date somebody read that URL. Where two
# official pages disagree, the entry carries a `note` and the disagreement is
# taught rather than hidden.
#
# Rules for editors:
#   - `verified` is the date a human opened `source` and read the value there.
#     Do not copy it forward from another entry.
#   - `status = "disputed"` means official sources conflict. Resolve against the
#     deployed contract, then downgrade to "current" and record what you found.
#   - `status = "deprecated"` means the value is retained for teaching only.

schema_version = 1
protocol_version = "Graph Horizon (2025-12-11)"

