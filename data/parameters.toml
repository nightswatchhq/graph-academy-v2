unit = "% of stake"
display = "2.5%"
status = "current"
source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"
quote = "The recommended value is 2.5% of the indexer's stake."
verified = "2026-08-30"

[fisherman_dispute_deposit]
label = "Fisherman dispute deposit"
value = 10000
unit = "GRT"
display = "10,000 GRT"
