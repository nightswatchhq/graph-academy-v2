[delegation_tax_pct]
conflict = true
label = "Delegation tax"
value = 0
unit = "%"
display = "0%"
status = "deprecated"
source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"
quote = "The 0.5% delegation tax has been completely removed."
note = """
Removed by Graph Horizon. The tokenomics page has not caught up: as read on \
2026-08-30 it still states "There is a 0.5% delegation tax which is burned whenever a \
Delegator delegates GRT on the network." Two official pages, two answers. The Horizon \
pages are the current ones. A delegator who budgets for a 0.5% haircut on deposit is \
working from stale documentation.\
"""
note_source = "https://thegraph.com/docs/en/resources/tokenomics/"
verified = "2026-08-30"

[max_simultaneous_undelegations]
conflict = true
label = "Simultaneous undelegation requests"
value = 1000
unit = "requests"
display = "1,000"
status = "disputed"
source = "https://thegraph.com/docs/en/resources/roles/delegating/delegating/"
quote = "Horizon supports up to 1,000 simultaneous undelegation requests, removing the previous restriction to a single active undelegation at a time."
note = """
The two official pages disagree, and both were read on 2026-08-30. The Delegating page \
says 1,000. The Horizon changes page says "Delegators can now have multiple undelegation \
requests processing simultaneously (up to 100)." Unresolved. The practical guidance does \
not turn on which is right, because both are far above what any delegator queues in \
practice, but the registry records the conflict rather than picking a winner. Resolution \
requires reading MAX_THAW_REQUESTS on the deployed HorizonStaking contract.\
"""
note_source = "https://thegraph.com/docs/en/graph-horizon/what-changes/"
onchain_ref = "HorizonStaking.MAX_THAW_REQUESTS"
verified = "2026-08-30"

[delegated_stake_slashable]
label = "Delegated stake slashable"
value = false
unit = ""
display = "Not currently"
status = "current"
source = "https://thegraph.com/docs/en/resources/roles/delegating/delegating/"
quote = "Horizon introduces the technical capability for delegated stake to be slashed in the future. This capability is not currently enabled for SubgraphService."
note = "A capability that exists and is switched off. Teach it as a future risk, never as current behaviour, and never omit it."
verified = "2026-08-30"

