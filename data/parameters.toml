# Query fee rebates (GIP-0051)
# --------------------------------------------------------------------------

[rebate_lambda]
label = "Rebate function lambda"
value = 0.6
unit = ""
display = "0.6"
status = "current"
source = "https://github.com/graphprotocol/graph-improvement-proposals/blob/main/gips/0051-exponential-rebates.md"
quote = "We believe setting lambda=0.6 and alpha=1 ensures there will be enough stake to secure the network without putting too much of a staking burden on indexers."
note = """
The value proposed in GIP-0051. The deployed value lives in contract storage as \
lambdaNumerator / lambdaDenominator and can be changed by governance without a new \
GIP number. The GIP's own worked figures reproduce exactly at lambda 0.6 and alpha 1: \
a stake ratio of 4 returns 90.9% of fees, 6 returns 97.3%, 8 returns 99.2%. Anyone \
sizing real stake should read the contract rather than this page.\
"""
# No onchain_ref. Recorded as HorizonStaking.lambdaNumerator, which reverts, and
# not found on SubgraphService or GraphPayments either. Needs the deployed ABI.
verified = "2026-08-30"

