[reo_active_days_required]
label = "Active days required for rewards eligibility"
value = 5
unit = "days"
display = "5 days"
status = "current"
source = "https://github.com/graphprotocol/rewards-eligibility-oracle/blob/main/ELIGIBILITY_CRITERIA.md"
