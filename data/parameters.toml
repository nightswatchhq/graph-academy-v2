# --------------------------------------------------------------------------
# Issuance routing (GIP-0089, the Innovation Allocation)
# --------------------------------------------------------------------------

[innovation_allocation_pct]
conflict = true
label = "Issuance redirected to the Innovation Allocation"
value = 20
unit = "% of protocol issuance"
display = "20%"
status = "disputed"
source = "https://forum.thegraph.com/t/the-graph-council-has-approved-gip-0089-the-innovation-allocation/7035"
quote = "The Graph Council has approved GIP-0089, directing 20% of protocol issuance to the Innovation Allocation."
onchain_ref = "IssuanceAllocator.getTargetAllocation"
# The site teaches the 20% governance approved. The contract allocates none of
# it yet, so that is what the reconciler expects to read. When this goes red the
# redirect has activated.
onchain_expect = 0
note = """
Approved by Council on 2026-08-26, with an effective date given as 2026-08-31 in one \
place in the forum post and 2026-09-01 in another. As of Arbitrum One block 500226907 on \
2026-08-31 the redirect is configured but carries no value: the Issuance Allocator at \
0xb64f29b2d81140ffc3a135e319561a1bd03b1a7e holds two targets, and getTargetAllocation \
returns 120.73 GRT per block for the Rewards Manager and zero for the other. The Rewards \
Manager also still holds the minter role and still reports issuancePerBlock() of 120.73. \
So the approved figure is 20% and the flowing figure is 0%. Re-read the contract before \
quoting either: this is expected to change, and the whole point of recording the block \
number is that a reader can tell how stale this reading is.\
"""
note_source = "https://github.com/nightswatchhq/graph-support/issues/23"
verified = "2026-08-31"

[subgraph_service_issuance_per_block]
conflict = true
label = "Issuance reaching the Rewards Manager"
value = 120.73
unit = "GRT per block"
display = "120.73 GRT/block"
status = "disputed"
source = "https://forum.thegraph.com/t/the-graph-council-has-approved-gip-0089-the-innovation-allocation/7035"
quote = "The SubgraphService Rewards Manager receives 96.584 GRT per block, a reduction of 24.146 GRT per block from 120.73."
onchain_ref = "RewardsManager.issuancePerBlock"
onchain_expect = 120.73
note = """
The approved figure is 96.584 GRT per block. The deployed figure is 120.73. Read from \
Arbitrum One at block 500226907 on 2026-08-31: issuancePerBlock() on the Rewards Manager \
at 0x971B9d3d0Ae3ECa029CAB5eA1fB0F72c85e6a525 returns 120730000000000000000, and the \
Issuance Allocator allocates that same 120.73 to it while allocating zero to its other \
target. Reproduce with cast against any public Arbitrum One RPC; it takes a minute and it \
beats trusting this file. This entry carries the deployed value because that is what \
indexers are actually being paid from, and the approved value in the quote above so the \
gap is visible rather than hidden.\
"""
note_source = "https://github.com/nightswatchhq/graph-support/issues/23"
verified = "2026-08-31"

